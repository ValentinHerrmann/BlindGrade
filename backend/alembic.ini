[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.

# Database URL — overridden at runtime by env var DATABASE_URL
# asyncpg for application; psycopg2 for Alembic sync env
sqlalchemy.url = postgresql+psycopg2://blindgrade:blindgrade@localhost:5432/blindgrade
