services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blindgrade
      POSTGRES_PASSWORD: blindgrade
      POSTGRES_DB: blindgrade
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blindgrade"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://blindgrade:blindgrade@db:5432/blindgrade
      DATABASE_URL_SYNC: postgresql+psycopg2://blindgrade:blindgrade@db:5432/blindgrade
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_openssl_rand_hex_32"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 7
      # Required — no wildcard default; app refuses to start if unset
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app   # dev hot-reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Retention cron — runs `python -m app.cli run-retention` daily at 02:00
  # In production, replace with a Kubernetes CronJob or systemd timer
  retention-cron:
    image: busybox
    restart: unless-stopped
    command: >
      sh -c "while true; do
        sleep 86400;
        docker exec blindgrade-backend-1 python -m app.cli run-retention;
      done"
    profiles:
      - prod   # Only active in production; dev runs retention manually

volumes:
  pg_data:
